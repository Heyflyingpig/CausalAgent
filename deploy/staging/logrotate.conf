# 网关日志轮转策略（POSIX sh 变量文件）。
# 本文件由 deploy/staging/rotate_gateway_logs.sh 在 gateway 容器内 source 执行；
# 不再是 logrotate(8) 语法——nginx:1.27-alpine 镜像不含 logrotate 与 cron，
# 容器内脚本轮转是唯一执行者。修改数值即可，无需改动脚本。
# 对应关系：ROTATION_MAX_AGE_HOURS=daily、ROTATION_MAX_SIZE_MB=maxsize、
#           RETENTION_ROTATIONS=rotate、压缩=gzip（无 delaycompress）。

# 距上次轮转超过该小时数则强制轮转（默认 24，等价 daily）。
ROTATION_MAX_AGE_HOURS="24"

# 单个日志文件超过该 MiB 立即轮转（默认 20，等价 maxsize 20M）。
ROTATION_MAX_SIZE_MB="20"

# 每个流保留的已压缩轮转文件数量（默认 45，对齐弃用观察 45 天规则）。
RETENTION_ROTATIONS="45"

# 轮转检查周期秒数（默认 3600；大小触发精度受此值限制）。
CHECK_INTERVAL_SECONDS="3600"
