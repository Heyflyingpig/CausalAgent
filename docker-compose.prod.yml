# ==========================================
# CausalAgent Docker Compose 配置文件（生产环境）
# ==========================================
# 目的：用于生产部署的配置
# 与开发环境的主要区别：
#   1. 不挂载源代码（代码在镜像内）
#   2. 启用自动重启
#   3. 配置日志管理
#   4. 不暴露MySQL端口（安全性）
#   5. 使用构建好的镜像标签

services:

  # --- MySQL 数据库服务（生产配置）---
  mysql:
    image: mysql:8.0
    container_name: causalagent_mysql_prod
    
    # 原因：添加_prod后缀，区分开发和生产容器
    
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    
    # 注意：生产环境应该使用更强的密码
    # 可以考虑使用Docker secrets而不是环境变量（更安全）
    
    # === 关键区别1：不暴露端口 ===
    # ports:
    #   - "3306:3306"  # 注释掉！
    
    # 原因：
    # - 生产环境不应该让外部直接访问数据库
    # - 只有app容器需要访问MySQL
    # - 同一网络内的容器无需端口映射就能通信
    # - 提高安全性，防止未授权访问
    # - 如果需要管理数据库，通过堡垒机或VPN
    
    volumes:
      - mysql_data_prod:/var/lib/mysql
    
    # 原因：使用独立的生产数据卷
    # - 与开发环境数据隔离
    # - 防止误操作删除生产数据
    
    networks:
      - causalagent_network_prod
    
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping --protocol=tcp -h 127.0.0.1 -P 3306 -u root"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    
    # === 关键区别2：自动重启策略 ===
    restart: unless-stopped
    
    # 原因：
    # - 确保服务意外退出时自动恢复
    # - unless-stopped：重启服务器后自动启动
    # - 除非手动执行 docker-compose down
    
    # === 关键区别3：日志管理 ===
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # 原因解释（防止日志占满磁盘）：
    # - driver: json-file 是默认日志驱动
    # - max-size: "10m" 单个日志文件最大10MB
    # - max-file: "3" 最多保留3个日志文件
    # - 总日志大小：10MB × 3 = 30MB
    # - 超过限制会自动轮转（删除最旧的）
    # - 如果不限制，日志可能增长到几GB
    # 生产环境可以考虑更高级的日志方案：
    # - driver: "syslog" 发送到syslog服务器
    # - driver: "fluentd" 集中式日志收集
    # - driver: "awslogs" 如果在AWS上部署

  # --- LangGraph checkpoint PostgreSQL（生产配置）---
  postgres-checkpoint:
    image: postgres:16-alpine
    container_name: causalagent_postgres_checkpoint_prod
    environment:
      POSTGRES_DB: ${CHECKPOINT_POSTGRES_DATABASE:-causalagent_checkpoints}
      POSTGRES_USER: ${CHECKPOINT_POSTGRES_USER:-causalagent_checkpoint}
      POSTGRES_PASSWORD: ${CHECKPOINT_POSTGRES_PASSWORD:?CHECKPOINT_POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_checkpoint_data_prod:/var/lib/postgresql/data
    networks:
      - causalagent_network_prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # --- Flask 应用服务（生产配置）---
  app:
    # === 关键区别4：使用镜像而非构建 ===
    image: causalagent:latest
    # 原因：
    # - 生产环境应该使用预构建的镜像
    # - 镜像应该在CI/CD中构建并测试
    # - 不在生产服务器上构建（减少依赖，提高安全性）
    # 
    # 替代方案（如果需要在服务器上构建）：
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    # image: causalagent:v1.0.0  # 给构建的镜像打标签
    
    container_name: causalagent_app_prod
    
    environment:
      - MYSQL_HOST=mysql  # 仍然使用服务名
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_POOL_SIZE_WRITE=${MYSQL_POOL_SIZE_WRITE:-5}
      - MYSQL_POOL_SIZE_READ=${MYSQL_POOL_SIZE_READ:-5}
      - MYSQL_CONNECT_TIMEOUT_SECONDS=${MYSQL_CONNECT_TIMEOUT_SECONDS:-5}
      - MYSQL_POOL_ACQUIRE_TIMEOUT_SECONDS=${MYSQL_POOL_ACQUIRE_TIMEOUT_SECONDS:-3}
      - MYSQL_POOL_ACQUIRE_RETRY_MS=${MYSQL_POOL_ACQUIRE_RETRY_MS:-50}
      - MYSQL_REPLICA_STATUS_CACHE_SECONDS=${MYSQL_REPLICA_STATUS_CACHE_SECONDS:-2}
      - ADMIN_BATCH_MAX_TARGETS=${ADMIN_BATCH_MAX_TARGETS:-20}
      - ADMIN_DELETE_MAX_RELATED_ROWS=${ADMIN_DELETE_MAX_RELATED_ROWS:-10000}
      - ADMIN_DB_LOCK_WAIT_TIMEOUT_SECONDS=${ADMIN_DB_LOCK_WAIT_TIMEOUT_SECONDS:-5}
      - CHECKPOINT_POSTGRES_HOST=postgres-checkpoint
      - CHECKPOINT_POSTGRES_PORT=5432
      - CHECKPOINT_POSTGRES_DATABASE=${CHECKPOINT_POSTGRES_DATABASE:-causalagent_checkpoints}
      - CHECKPOINT_POSTGRES_USER=${CHECKPOINT_POSTGRES_USER:-causalagent_checkpoint}
      - CHECKPOINT_POSTGRES_PASSWORD=${CHECKPOINT_POSTGRES_PASSWORD}
      - CHECKPOINT_POSTGRES_CONNECT_TIMEOUT_SECONDS=${CHECKPOINT_POSTGRES_CONNECT_TIMEOUT_SECONDS:-5}
      - CHECKPOINT_POSTGRES_POOL_MIN_SIZE=${CHECKPOINT_POSTGRES_POOL_MIN_SIZE:-1}
      - CHECKPOINT_POSTGRES_POOL_MAX_SIZE=${CHECKPOINT_POSTGRES_POOL_MAX_SIZE:-5}
      - JOB_WORKERS=${JOB_WORKERS:-2}
      - JOB_HEARTBEAT_INTERVAL_SECONDS=${JOB_HEARTBEAT_INTERVAL_SECONDS:-10}
      - JOB_STALE_AFTER_SECONDS=${JOB_STALE_AFTER_SECONDS:-120}
      - JOB_MAX_ATTEMPTS=${JOB_MAX_ATTEMPTS:-3}
      - JOB_CHAT_HISTORY_LIMIT=${JOB_CHAT_HISTORY_LIMIT:-20}
      - API_KEY=${API_KEY}
      - BASE_URL=${BASE_URL}
      - MODEL=${MODEL}
      - SECRET_KEY=${SECRET_KEY}
      - DB_INSPECTION_QUERY_TIMEOUT_MS=${DB_INSPECTION_QUERY_TIMEOUT_MS:-3000}
      - DB_DASHBOARD_CONNECTION_WARNING_PERCENT=${DB_DASHBOARD_CONNECTION_WARNING_PERCENT:-70}
      - DB_DASHBOARD_CONNECTION_CRITICAL_PERCENT=${DB_DASHBOARD_CONNECTION_CRITICAL_PERCENT:-85}
      - DB_MONITOR_AUTO_REFRESH_ENABLED=${DB_MONITOR_AUTO_REFRESH_ENABLED:-true}
      - DB_MONITOR_REALTIME_INTERVAL_SECONDS=${DB_MONITOR_REALTIME_INTERVAL_SECONDS:-10}
      - DB_MONITOR_SQL_INTERVAL_SECONDS=${DB_MONITOR_SQL_INTERVAL_SECONDS:-60}
      - DB_MONITOR_TABLE_CAPACITY_INTERVAL_SECONDS=${DB_MONITOR_TABLE_CAPACITY_INTERVAL_SECONDS:-900}
      - DB_MONITOR_SLOW_QUERY_WARNING_DELTA=${DB_MONITOR_SLOW_QUERY_WARNING_DELTA:-1}
      - DB_MONITOR_INTEGRITY_ENABLED=${DB_MONITOR_INTEGRITY_ENABLED:-false}
      - DB_MONITOR_INTEGRITY_INTERVAL_SECONDS=${DB_MONITOR_INTEGRITY_INTERVAL_SECONDS:-86400}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY:-}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-}
      
      # === 关键区别5：生产环境变量 ===
      - FLASK_ENV=production
      - RAG_EVAL_ROOT=/app/tmp/rag_eval
      - RAG_EVAL_DATASET_ROOT=/app/tmp/rag_eval/datasets/registered
      
      # 原因：
      # - production模式关闭调试信息
      # - 不会自动重载代码
      # - 错误信息不暴露堆栈（安全性）
      # - 性能优化
    
    ports:
      - "5001:5001"
    
    # 生产环境通常会在前面加Nginx反向代理：
    # 客户端 -> Nginx(:80/:443) -> Flask(:5001)
    # 这样可以：
    # - 处理HTTPS
    # - 负载均衡
    # - 静态文件服务
    # - 防止DDoS
    
    # === 关键区别6：不挂载源代码 ===
    volumes:
      # 注意：不挂载 .:/app
      # 代码已经在构建时COPY到镜像内了
      
      # 只挂载需要持久化的数据
      - ./Agent/knowledge_base/models:/app/Agent/knowledge_base/models:ro
      - ./Agent/knowledge_base/source:/app/Agent/knowledge_base/source:ro
      - ./Agent/knowledge_base/db:/app/Agent/knowledge_base/db
      - ./Agent/knowledge_base/multimodal_indexes:/app/Agent/knowledge_base/multimodal_indexes:ro
      - ./Agent/knowledge_base/multimodal_runtime:/app/Agent/knowledge_base/multimodal_runtime:ro
      - ./Agent/knowledge_base/multimodal_assets:/app/Agent/knowledge_base/multimodal_assets:ro
      - ./Agent/knowledge_base/rag/runtime:/app/Agent/knowledge_base/rag/runtime:ro
      - ./app/static/generated_graphs:/app/app/static/generated_graphs
      - app_logs_prod:/app/logs  # 新增：应用日志持久化
      - rag_eval_isolated_runs:/app/tmp/rag_eval/runs                    # 隔离运行目录（与 rag-eval-worker 共享）
      - rag_eval_sources:/app/tmp/rag_eval/sources                       # 知识源目录（与 rag-eval-worker 共享）
      - rag_eval_datasets:/app/tmp/rag_eval/datasets/registered          # 数据集目录（与 rag-eval-worker 共享）
      - rag_eval_artifacts:/app/tmp/rag_eval/artifacts
      - rag_eval_reports:/app/tmp/rag_eval/reports
    
    # 原因：
    # - 代码在镜像内，不依赖宿主机文件系统
    # - 镜像是不可变的（immutable），符合最佳实践
    # - 回滚时只需切换镜像标签
    # - 不会因为误修改文件导致问题
    
    depends_on:
      mysql:
        condition: service_healthy
      postgres-checkpoint:
        condition: service_healthy
      db-bootstrap:
        condition: service_completed_successfully
    
    networks:
      - causalagent_network_prod
    
    restart: unless-stopped
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # === 可选：资源限制 ===
    # 生产环境建议配置资源限制，防止一个服务占用所有资源
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '1.0'        # 最多使用1个CPU核心
    #       memory: 2G         # 最多使用2GB内存
    #     reservations:
    #       cpus: '0.5'        # 保证至少0.5个核心
    #       memory: 1G         # 保证至少1GB内存
    
    # 注意：deploy配置需要Docker Swarm或Kubernetes
    # 如果是单机部署，使用docker run的--cpus和--memory参数

  worker:
    image: causalagent:latest
    container_name: causalagent_worker_prod
    command: python -m app.agent.worker
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_WRITE_HOST=mysql
      - MYSQL_READ_HOSTS=
      - MYSQL_PORT=3306
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_WRITE_USER=${MYSQL_WRITE_USER:-${MYSQL_USER}}
      - MYSQL_WRITE_PASSWORD=${MYSQL_WRITE_PASSWORD:-${MYSQL_PASSWORD}}
      - MYSQL_READ_USER=${MYSQL_READ_USER:-${MYSQL_USER}}
      - MYSQL_READ_PASSWORD=${MYSQL_READ_PASSWORD:-${MYSQL_PASSWORD}}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_POOL_SIZE_WRITE=${MYSQL_POOL_SIZE_WRITE:-5}
      - MYSQL_POOL_SIZE_READ=${MYSQL_POOL_SIZE_READ:-5}
      - MYSQL_CONNECT_TIMEOUT_SECONDS=${MYSQL_CONNECT_TIMEOUT_SECONDS:-5}
      - MYSQL_POOL_ACQUIRE_TIMEOUT_SECONDS=${MYSQL_POOL_ACQUIRE_TIMEOUT_SECONDS:-3}
      - MYSQL_POOL_ACQUIRE_RETRY_MS=${MYSQL_POOL_ACQUIRE_RETRY_MS:-50}
      - MYSQL_REPLICA_STATUS_CACHE_SECONDS=${MYSQL_REPLICA_STATUS_CACHE_SECONDS:-2}
      - CHECKPOINT_POSTGRES_HOST=postgres-checkpoint
      - CHECKPOINT_POSTGRES_PORT=5432
      - CHECKPOINT_POSTGRES_DATABASE=${CHECKPOINT_POSTGRES_DATABASE:-causalagent_checkpoints}
      - CHECKPOINT_POSTGRES_USER=${CHECKPOINT_POSTGRES_USER:-causalagent_checkpoint}
      - CHECKPOINT_POSTGRES_PASSWORD=${CHECKPOINT_POSTGRES_PASSWORD}
      - CHECKPOINT_POSTGRES_CONNECT_TIMEOUT_SECONDS=${CHECKPOINT_POSTGRES_CONNECT_TIMEOUT_SECONDS:-5}
      - CHECKPOINT_POSTGRES_POOL_MIN_SIZE=${CHECKPOINT_POSTGRES_POOL_MIN_SIZE:-1}
      - CHECKPOINT_POSTGRES_POOL_MAX_SIZE=${CHECKPOINT_POSTGRES_POOL_MAX_SIZE:-5}
      - JOB_WORKERS=${JOB_WORKERS:-2}
      - JOB_HEARTBEAT_INTERVAL_SECONDS=${JOB_HEARTBEAT_INTERVAL_SECONDS:-10}
      - JOB_STALE_AFTER_SECONDS=${JOB_STALE_AFTER_SECONDS:-120}
      - JOB_DRAIN_TIMEOUT_SECONDS=${JOB_DRAIN_TIMEOUT_SECONDS:-60}
      - JOB_MAX_ATTEMPTS=${JOB_MAX_ATTEMPTS:-3}
      - JOB_CHAT_HISTORY_LIMIT=${JOB_CHAT_HISTORY_LIMIT:-20}
      - WEB_SEARCH_PROVIDER=${WEB_SEARCH_PROVIDER:-searxng}
      - SEARXNG_URL=${SEARXNG_URL:-http://searxng:8080}
      - API_KEY=${API_KEY}
      - BASE_URL=${BASE_URL}
      - MODEL=${MODEL}
      - SECRET_KEY=${SECRET_KEY}
      - FLASK_ENV=production
      - MULTIMODAL_DOCLING_ARTIFACTS_DIR=/app/Agent/knowledge_base/models/docling
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY:-}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-}
    volumes:
      - ./Agent/knowledge_base/models:/app/Agent/knowledge_base/models:ro
      - ./Agent/knowledge_base/source:/app/Agent/knowledge_base/source:ro
      - ./Agent/knowledge_base/db:/app/Agent/knowledge_base/db
      - ./Agent/knowledge_base/multimodal_indexes:/app/Agent/knowledge_base/multimodal_indexes:ro
      - ./Agent/knowledge_base/multimodal_runtime:/app/Agent/knowledge_base/multimodal_runtime:ro
      - ./Agent/knowledge_base/multimodal_assets:/app/Agent/knowledge_base/multimodal_assets:ro
      - ./Agent/knowledge_base/rag/runtime:/app/Agent/knowledge_base/rag/runtime:ro
      - app_logs_prod:/app/logs
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
    networks:
      - causalagent_network_prod
    restart: unless-stopped
    stop_grace_period: 75s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  checkpoint-cleanup:
    image: causalagent:latest
    container_name: causalagent_checkpoint_cleanup_prod
    command: python -m Database.checkpoint_cleanup_worker
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_WRITE_HOST=mysql
      - MYSQL_READ_HOSTS=
      - MYSQL_PORT=3306
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_WRITE_USER=${MYSQL_WRITE_USER:-${MYSQL_USER}}
      - MYSQL_WRITE_PASSWORD=${MYSQL_WRITE_PASSWORD:-${MYSQL_PASSWORD}}
      - MYSQL_READ_USER=${MYSQL_READ_USER:-${MYSQL_USER}}
      - MYSQL_READ_PASSWORD=${MYSQL_READ_PASSWORD:-${MYSQL_PASSWORD}}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_POOL_SIZE_WRITE=${MYSQL_POOL_SIZE_WRITE:-3}
      - MYSQL_POOL_SIZE_READ=${MYSQL_POOL_SIZE_READ:-1}
      - MYSQL_CONNECT_TIMEOUT_SECONDS=${MYSQL_CONNECT_TIMEOUT_SECONDS:-5}
      - MYSQL_POOL_ACQUIRE_TIMEOUT_SECONDS=${MYSQL_POOL_ACQUIRE_TIMEOUT_SECONDS:-3}
      - MYSQL_POOL_ACQUIRE_RETRY_MS=${MYSQL_POOL_ACQUIRE_RETRY_MS:-50}
      - CHECKPOINT_POSTGRES_HOST=postgres-checkpoint
      - CHECKPOINT_POSTGRES_PORT=5432
      - CHECKPOINT_POSTGRES_DATABASE=${CHECKPOINT_POSTGRES_DATABASE:-causalagent_checkpoints}
      - CHECKPOINT_POSTGRES_USER=${CHECKPOINT_POSTGRES_USER:-causalagent_checkpoint}
      - CHECKPOINT_POSTGRES_PASSWORD=${CHECKPOINT_POSTGRES_PASSWORD}
      - CHECKPOINT_POSTGRES_CONNECT_TIMEOUT_SECONDS=${CHECKPOINT_POSTGRES_CONNECT_TIMEOUT_SECONDS:-5}
      - CHECKPOINT_POSTGRES_POOL_MIN_SIZE=1
      - CHECKPOINT_POSTGRES_POOL_MAX_SIZE=2
      - CHECKPOINT_CLEANUP_POLL_INTERVAL_SECONDS=${CHECKPOINT_CLEANUP_POLL_INTERVAL_SECONDS:-1}
      - CHECKPOINT_CLEANUP_HEARTBEAT_INTERVAL_SECONDS=${CHECKPOINT_CLEANUP_HEARTBEAT_INTERVAL_SECONDS:-10}
      - CHECKPOINT_CLEANUP_LEASE_SECONDS=${CHECKPOINT_CLEANUP_LEASE_SECONDS:-300}
      - API_KEY=${API_KEY}
      - BASE_URL=${BASE_URL}
      - MODEL=${MODEL}
      - SECRET_KEY=${SECRET_KEY}
      - FLASK_ENV=production
    volumes:
      - app_logs_prod:/app/logs
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
    networks:
      - causalagent_network_prod
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  monitor:
    image: causalagent:latest
    container_name: causalagent_monitor_prod
    command: python -m Database.monitor_worker

    environment:
      - MYSQL_HOST=mysql
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_POOL_SIZE_WRITE=${MYSQL_POOL_SIZE_WRITE:-5}
      - MYSQL_POOL_SIZE_READ=${MYSQL_POOL_SIZE_READ:-5}
      - MYSQL_CONNECT_TIMEOUT_SECONDS=${MYSQL_CONNECT_TIMEOUT_SECONDS:-5}
      - MYSQL_POOL_ACQUIRE_TIMEOUT_SECONDS=${MYSQL_POOL_ACQUIRE_TIMEOUT_SECONDS:-3}
      - MYSQL_POOL_ACQUIRE_RETRY_MS=${MYSQL_POOL_ACQUIRE_RETRY_MS:-50}
      - MYSQL_REPLICA_STATUS_CACHE_SECONDS=${MYSQL_REPLICA_STATUS_CACHE_SECONDS:-2}
      - JOB_STALE_AFTER_SECONDS=${JOB_STALE_AFTER_SECONDS:-120}
      - CHECKPOINT_POSTGRES_HOST=postgres-checkpoint
      - CHECKPOINT_POSTGRES_PORT=5432
      - CHECKPOINT_POSTGRES_DATABASE=${CHECKPOINT_POSTGRES_DATABASE:-causalagent_checkpoints}
      - CHECKPOINT_POSTGRES_USER=${CHECKPOINT_POSTGRES_USER:-causalagent_checkpoint}
      - CHECKPOINT_POSTGRES_PASSWORD=${CHECKPOINT_POSTGRES_PASSWORD}
      - CHECKPOINT_POSTGRES_CONNECT_TIMEOUT_SECONDS=${CHECKPOINT_POSTGRES_CONNECT_TIMEOUT_SECONDS:-5}
      - CHECKPOINT_POSTGRES_POOL_MIN_SIZE=${CHECKPOINT_POSTGRES_POOL_MIN_SIZE:-1}
      - CHECKPOINT_POSTGRES_POOL_MAX_SIZE=${CHECKPOINT_POSTGRES_POOL_MAX_SIZE:-5}
      - API_KEY=${API_KEY}
      - BASE_URL=${BASE_URL}
      - MODEL=${MODEL}
      - SECRET_KEY=${SECRET_KEY}
      - DB_INSPECTION_QUERY_TIMEOUT_MS=${DB_INSPECTION_QUERY_TIMEOUT_MS:-3000}
      - DB_DASHBOARD_CONNECTION_WARNING_PERCENT=${DB_DASHBOARD_CONNECTION_WARNING_PERCENT:-70}
      - DB_DASHBOARD_CONNECTION_CRITICAL_PERCENT=${DB_DASHBOARD_CONNECTION_CRITICAL_PERCENT:-85}
      - DB_MONITOR_AUTO_REFRESH_ENABLED=${DB_MONITOR_AUTO_REFRESH_ENABLED:-true}
      - DB_MONITOR_REALTIME_INTERVAL_SECONDS=${DB_MONITOR_REALTIME_INTERVAL_SECONDS:-10}
      - DB_MONITOR_SQL_INTERVAL_SECONDS=${DB_MONITOR_SQL_INTERVAL_SECONDS:-60}
      - DB_MONITOR_TABLE_CAPACITY_INTERVAL_SECONDS=${DB_MONITOR_TABLE_CAPACITY_INTERVAL_SECONDS:-900}
      - DB_MONITOR_SLOW_QUERY_WARNING_DELTA=${DB_MONITOR_SLOW_QUERY_WARNING_DELTA:-1}
      - DB_MONITOR_INTEGRITY_ENABLED=${DB_MONITOR_INTEGRITY_ENABLED:-false}
      - DB_MONITOR_INTEGRITY_INTERVAL_SECONDS=${DB_MONITOR_INTEGRITY_INTERVAL_SECONDS:-86400}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY:-}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-}
      - FLASK_ENV=production

    depends_on:
      mysql:
        condition: service_healthy
      postgres-checkpoint:
        condition: service_healthy
      db-bootstrap:
        condition: service_completed_successfully

    networks:
      - causalagent_network_prod

    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  rag-eval-worker:
    image: causalagent:latest
    container_name: causalagent_rag_eval_worker_prod
    command: python -m app.rag_eval.worker

    environment:
      - MYSQL_HOST=mysql
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_POOL_SIZE_WRITE=${MYSQL_POOL_SIZE_WRITE:-5}
      - MYSQL_POOL_SIZE_READ=${MYSQL_POOL_SIZE_READ:-5}
      - MYSQL_CONNECT_TIMEOUT_SECONDS=${MYSQL_CONNECT_TIMEOUT_SECONDS:-5}
      - MYSQL_POOL_ACQUIRE_TIMEOUT_SECONDS=${MYSQL_POOL_ACQUIRE_TIMEOUT_SECONDS:-3}
      - MYSQL_POOL_ACQUIRE_RETRY_MS=${MYSQL_POOL_ACQUIRE_RETRY_MS:-50}
      - MYSQL_REPLICA_STATUS_CACHE_SECONDS=${MYSQL_REPLICA_STATUS_CACHE_SECONDS:-2}
      - RAG_EVAL_ROOT=/app/tmp/rag_eval
      - RAG_EVAL_DATASET_ROOT=/app/tmp/rag_eval/datasets/registered
      - RAG_EVAL_EVALUATION_WORKERS=${RAG_EVAL_EVALUATION_WORKERS:-5}
      - RAG_EVAL_INGESTION_CONCURRENCY_LIMIT=${RAG_EVAL_INGESTION_CONCURRENCY_LIMIT:-1}
      - RAG_EVAL_CANDIDATE_GENERATION_CONCURRENCY_LIMIT=${RAG_EVAL_CANDIDATE_GENERATION_CONCURRENCY_LIMIT:-1}
      - RAG_EVAL_TUNING_DATASET_GOVERNANCE_CONCURRENCY_LIMIT=${RAG_EVAL_TUNING_DATASET_GOVERNANCE_CONCURRENCY_LIMIT:-1}
      - RAG_EVAL_DATASET_GOVERNANCE_CONCURRENCY_LIMIT=${RAG_EVAL_DATASET_GOVERNANCE_CONCURRENCY_LIMIT:-1}
      - RAG_EVAL_EVALUATION_CONCURRENCY_LIMIT=${RAG_EVAL_EVALUATION_CONCURRENCY_LIMIT:-3}
      - RAG_EVAL_RAG_QUERY_CONCURRENCY_LIMIT=${RAG_EVAL_RAG_QUERY_CONCURRENCY_LIMIT:-2}
      - RAG_EVAL_EVALUATION_POLL_INTERVAL_SECONDS=${RAG_EVAL_EVALUATION_POLL_INTERVAL_SECONDS:-1}
      - RAG_EVAL_EVALUATION_HEARTBEAT_INTERVAL_SECONDS=${RAG_EVAL_EVALUATION_HEARTBEAT_INTERVAL_SECONDS:-10}
      - RAG_EVAL_EVALUATION_JOB_STALE_AFTER_SECONDS=${RAG_EVAL_EVALUATION_JOB_STALE_AFTER_SECONDS:-120}
      - RAG_EVAL_EVALUATION_STALE_AFTER_SECONDS=${RAG_EVAL_EVALUATION_STALE_AFTER_SECONDS:-1800}
      - API_KEY=${API_KEY}
      - BASE_URL=${BASE_URL}
      - MODEL=${MODEL}
      - SECRET_KEY=${SECRET_KEY}
      - FLASK_ENV=production
      - MULTIMODAL_DOCLING_ARTIFACTS_DIR=/app/Agent/knowledge_base/models/docling
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY:-}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-}

    volumes:
      - ./Agent/knowledge_base/models:/app/Agent/knowledge_base/models:ro
      - ./Agent/knowledge_base/source:/app/Agent/knowledge_base/source:ro
      - ./Agent/knowledge_base/db:/app/Agent/knowledge_base/db
      - rag_eval_isolated_runs:/app/tmp/rag_eval/runs
      - rag_eval_sources:/app/tmp/rag_eval/sources
      - rag_eval_datasets:/app/tmp/rag_eval/datasets/registered
      - rag_eval_artifacts:/app/tmp/rag_eval/artifacts
      - rag_eval_reports:/app/tmp/rag_eval/reports

    depends_on:
      mysql:
        condition: service_healthy
      db-bootstrap:
        condition: service_completed_successfully

    networks:
      - causalagent_network_prod

    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  db-bootstrap:
    image: causalagent:latest
    container_name: causalagent_db_bootstrap_prod
    command: python -m Database.bootstrap

    environment:
      - MYSQL_HOST=mysql
      - MYSQL_WRITE_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_WRITE_USER=${MYSQL_WRITE_USER:-${MYSQL_USER}}
      - MYSQL_WRITE_PASSWORD=${MYSQL_WRITE_PASSWORD:-${MYSQL_PASSWORD}}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - CHECKPOINT_POSTGRES_HOST=postgres-checkpoint
      - CHECKPOINT_POSTGRES_PORT=5432
      - CHECKPOINT_POSTGRES_DATABASE=${CHECKPOINT_POSTGRES_DATABASE:-causalagent_checkpoints}
      - CHECKPOINT_POSTGRES_USER=${CHECKPOINT_POSTGRES_USER:-causalagent_checkpoint}
      - CHECKPOINT_POSTGRES_PASSWORD=${CHECKPOINT_POSTGRES_PASSWORD}
      - CHECKPOINT_POSTGRES_CONNECT_TIMEOUT_SECONDS=${CHECKPOINT_POSTGRES_CONNECT_TIMEOUT_SECONDS:-5}
      - CHECKPOINT_POSTGRES_POOL_MIN_SIZE=1
      - CHECKPOINT_POSTGRES_POOL_MAX_SIZE=2
      - FLASK_ENV=production

    depends_on:
      mysql:
        condition: service_healthy
      postgres-checkpoint:
        condition: service_healthy

    networks:
      - causalagent_network_prod

networks:
  causalagent_network_prod:
    driver: bridge
    # 生产环境也可以考虑：
    # - 使用overlay网络（跨主机）
    # - 配置防火墙规则
    # - 设置为internal（无外网访问）

volumes:
  mysql_data_prod:
    driver: local
    # 生产环境的数据备份策略：
    # 1. 定期备份此卷
    # 2. 考虑使用外部存储（NFS, AWS EBS等）
    # 3. 测试恢复流程

  postgres_checkpoint_data_prod:
    driver: local
  
  app_logs_prod:
    driver: local

  rag_eval_isolated_runs:
    driver: local

  rag_eval_sources:
    driver: local

  rag_eval_datasets:
    driver: local

  rag_eval_artifacts:
    driver: local

  rag_eval_reports:
    driver: local

# ==========================================
# 部署说明
# ==========================================
# 
# 首次部署：
#   1. 在服务器上准备代码和配置
#      git clone https://github.com/your-repo/CausalAgent.git
#      cd CausalAgent
#   
#   2. 创建生产环境配置
#      cp env.example .env
#      nano .env  # 填入生产环境的真实值
#   
#   3. 构建镜像（如果需要）
#      docker build -t causalagent:v1.0.0 .
#      docker tag causalagent:v1.0.0 causalagent:latest
#   
#   4. 启动服务
#      docker-compose -f docker-compose.prod.yml up -d
#   
#   5. 初始化数据库
#      up 会等待一次性 db-bootstrap 完成 MySQL migration 与 PostgreSQL setup
#   
#   6. 检查状态
#      docker-compose -f docker-compose.prod.yml ps
#      docker-compose -f docker-compose.prod.yml logs -f
#
# 更新部署：
#   1. 拉取新代码
#      git pull
#   
#   2. 重新构建镜像
#      docker build -t causalagent:v1.1.0 .
#      docker tag causalagent:v1.1.0 causalagent:latest
#   
#   3. 重启服务（滚动更新）
#      docker-compose -f docker-compose.prod.yml up -d --no-deps --build app
#      # --no-deps: 不重启依赖的服务（MySQL不受影响）
#   
#   4. 验证
#      docker-compose -f docker-compose.prod.yml logs -f app
#
# 回滚：
#   docker tag causalagent:v1.0.0 causalagent:latest
#   docker-compose -f docker-compose.prod.yml up -d app
#
# 备份数据：
#   docker run --rm \
#     -v causalagent_mysql_data_prod:/data \
#     -v $(pwd):/backup \
#     alpine tar czf /backup/mysql_backup_$(date +%Y%m%d).tar.gz /data
#
# 监控：
#   docker stats  # 实时查看资源使用
#   docker-compose -f docker-compose.prod.yml logs --tail=100
