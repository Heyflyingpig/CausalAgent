name: Windows Developer Preview Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: windows-developer-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build Windows Developer Preview
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate SemVer tag and main ancestry
        run: |
          $tag = $env:GITHUB_REF_NAME
          $semverPattern = '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if ($tag -notmatch $semverPattern) {
            throw "tag 必须是严格 SemVer（例如 v0.1.0）。"
          }

          git fetch origin main --force --prune
          if ($LASTEXITCODE -ne 0) {
            throw "无法获取 origin/main，停止发布。"
          }
          $tagCommit = (git rev-list -n 1 $tag 2>$null | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $tagCommit) {
            throw "无法解析 tag 对应的 commit，停止发布。"
          }
          git show-ref --verify --quiet refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "未找到 origin/main，停止发布。"
          }
          git merge-base --is-ancestor $tagCommit origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "tag commit 不在 origin/main 的历史中，停止发布。"
          }

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: windows-client/requirements-desktop-test.txt

      - name: Install desktop build and test dependencies
        run: >-
          python -m pip install
          --disable-pip-version-check
          -r windows-client/requirements-desktop-test.txt

      - name: Run desktop logic tests
        run: >-
          python -m pytest -q
          windows-client/tests/test_config.py
          windows-client/tests/test_navigation_policy.py
          windows-client/tests/test_runtime.py
          windows-client/tests/test_launcher.py

      - name: Build Developer Preview onefile package
        run: >-
          powershell -ExecutionPolicy Bypass
          -File .\windows-client\build.ps1
          -DistributionChannel DeveloperPreview
          -PackageMode onefile

      - name: Verify frozen Developer Preview marker
        run: |
          $mode = python -c "from PyInstaller.archive.readers import CArchiveReader; import pathlib; print(CArchiveReader(str(pathlib.Path(r'dist\CausalAgent.exe').resolve())).extract('causalagent_desktop\\desktop_mode.txt').decode().strip())"
          if ($LASTEXITCODE -ne 0 -or $mode.Trim() -ne "developer-preview") {
            throw "冻结包未包含 developer-preview 通道标记。"
          }

      - name: Verify frozen desktop environment
        run: |
          $executable = (Resolve-Path ".\dist\CausalAgent.exe").Path
          $process = Start-Process -FilePath $executable -ArgumentList "--check-environment" -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "冻结包桌面环境检查失败，exit code: $($process.ExitCode)。"
          }

      - name: Prepare release assets and SHA256
        run: |
          $distPath = Join-Path $env:GITHUB_WORKSPACE "dist\CausalAgent.exe"
          if (-not (Test-Path -LiteralPath $distPath -PathType Leaf)) {
            throw "PyInstaller 未生成 dist\CausalAgent.exe。"
          }
          if ((Get-Item -LiteralPath $distPath).Length -le 0) {
            throw "生成的 CausalAgent.exe 为空。"
          }

          $assetsPath = Join-Path $env:GITHUB_WORKSPACE "release-assets"
          New-Item -ItemType Directory -Path $assetsPath -Force | Out-Null
          $assetName = "CausalAgent-$($env:GITHUB_REF_NAME)-windows-x64-dev-preview.exe"
          $assetPath = Join-Path $assetsPath $assetName
          Copy-Item -LiteralPath $distPath -Destination $assetPath -Force

          $digest = (Get-FileHash -LiteralPath $assetPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumPath = Join-Path $assetsPath "SHA256SUMS.txt"
          "$digest *$assetName" | Set-Content -LiteralPath $checksumPath -Encoding ascii

          "ASSET_PATH=$assetPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CHECKSUM_PATH=$checksumPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload build artifact for inspection
        uses: actions/upload-artifact@v4
        with:
          name: CausalAgent-${{ github.ref_name }}-windows-x64-dev-preview
          path: release-assets/*
          if-no-files-found: error

      - name: Create or update draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $title = "CausalAgent $tag - Developer Preview"
          $versionedNotesPath = Join-Path $env:GITHUB_WORKSPACE ".github\release-notes\$tag.md"
          if (Test-Path -LiteralPath $versionedNotesPath -PathType Leaf) {
            $notesPath = $versionedNotesPath
          } else {
            $notesPath = Join-Path $env:GITHUB_WORKSPACE "release-assets\release-notes.md"
            @"
          ## CausalAgent $tag Developer Preview

          本版本面向开发者，提供 Windows WebView2 单文件桌面壳。EXE 不包含 Flask 后端、数据库、模型、知识库或 Docker 服务；使用前请按项目文档启动本地服务，并确保 `http://127.0.0.1:5001/` 可访问。

          - 目标平台：Windows x64、Microsoft Edge WebView2 Runtime
          - 构建通道：DeveloperPreview；默认地址：`http://127.0.0.1:5001/`
          - Docker 镜像：本版本不发布官方镜像
          - 生产服务、自动更新、代码签名：本版本不提供
          - GitHub 自动生成的 Source code 压缩包对应本 tag

          这是 Draft Pre-release，发布前请维护者检查 EXE、SHA256SUMS.txt 和本说明。
          "@ | Set-Content -LiteralPath $notesPath -Encoding utf8NoBOM
          }

          $releaseLookup = gh release view $tag --json isDraft 2>&1
          $lookupExit = $LASTEXITCODE
          if ($lookupExit -eq 0) {
            $release = $releaseLookup | ConvertFrom-Json
            if ($release.isDraft -ne $true) {
              throw "该 tag 已存在非 Draft Release，拒绝修改或覆盖。"
            }
            gh release edit $tag --draft --prerelease --title $title --notes-file $notesPath
            if ($LASTEXITCODE -ne 0) {
              throw "更新 Draft Release 失败。"
            }
            gh release upload $tag $env:ASSET_PATH $env:CHECKSUM_PATH --clobber
            if ($LASTEXITCODE -ne 0) {
              throw "上传 Draft Release 附件失败。"
            }
          } elseif ($lookupExit -eq 1 -and (($releaseLookup | Out-String) -match '(?i)(not found|404)')) {
            gh release create $tag --draft --prerelease --title $title --notes-file $notesPath $env:ASSET_PATH $env:CHECKSUM_PATH
          } else {
            throw "查询现有 Release 失败，拒绝创建或修改 Release。"
          }
          if ($LASTEXITCODE -ne 0) {
            throw "创建或上传 Draft Release 失败。"
          }
